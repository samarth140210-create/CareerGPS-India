{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h1>

                My Mission

            </h1>

            <hr>

            {% if mission %}

                <h3>

                    {{ mission.career_name }}

                </h3>

                <p>

                    <strong>
                        Status:
                    </strong>

                    Active

                </p>

                <a
                    href="{{ url_for(
                        'main.roadmap'
                    ) }}"
                    class="btn btn-success">

                    View Roadmap

                </a>

                <a
                    href="{{ url_for(
                        'main.progress'
                    ) }}"
                    class="btn btn-warning">

                    Track Progress

                </a>

                <p>

                    <strong>
                        Selected On:
                    </strong>

                    {{ mission.created_at }}

                </p>

            {% else %}

                <div
                    class="alert alert-warning">

                    No mission selected.

                </div>

                <a
                    href="{{ url_for(
                        'main.career_recommendations'
                    ) }}"
                    class="btn btn-primary">

                    Choose A Career

                </a>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
