{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body text-center">

            <h1 class="text-success">

                🏆 Mission Completed

            </h1>

            <hr>

            <h3>

                Congratulations!

            </h3>

            <p>

                You have successfully completed:

            </p>

            <h2>

                {{ mission.career_name }}

            </h2>

            <p class="mt-3">

                Completed On:

                {{ mission.completed_at.strftime('%d %B %Y') }}

            </p>

            <div class="mt-4">

                <a
                    href="{{ url_for(
                        'main.profile'
                    ) }}"
                    class="btn btn-primary">

                    View Profile

                </a>

                <a
                    href="{{ url_for(
                        'main.career_recommendations'
                    ) }}"
                    class="btn btn-success">

                    Explore New Career

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
